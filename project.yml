name: OpenWebUI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # The reusable core — local Swift package (app #2 will depend on it too).
  OpenWebUIKit:
    path: OpenWebUIKit
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  SwiftWhisper:
    url: https://github.com/exPHAT/SwiftWhisper
    branch: master
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.12.4"

settings:
  base:
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"   # set by setup.sh (env var) — your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OpenWebUI:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Info-macOS.plist"
          - "Resources/Odysseus-macOS.entitlements"
    dependencies:
      - package: OpenWebUIKit
      - package: MarkdownUI
      - package: SwiftWhisper
      - package: ZIPFoundation
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.openwebui
        PRODUCT_NAME: OpenWebUI
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: OpenWebUI
        # Drive the version from the build settings (xcodegen otherwise hardcodes
        # CFBundleVersion=1, which overrode CURRENT_PROJECT_VERSION → "1.0 (1)").
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Orientations must live in the Info.plist itself — the INFOPLIST_KEY_*
        # build settings are ignored when a custom Info.plist is used, which made
        # the upload fail (90474). iPad needs all four for multitasking.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "O app precisa acessar o servidor Open WebUI na sua rede local."
        NSMicrophoneUsageDescription: "Para ditar mensagens por voz."
        NSSpeechRecognitionUsageDescription: "Para transcrever sua voz em texto no dispositivo."
        NSPhotoLibraryUsageDescription: "Para anexar imagens às conversas."
        NSCameraUsageDescription: "Para capturar e anexar fotos às conversas."
        NSPhotoLibraryAddUsageDescription: "Para salvar imagens das conversas na sua galeria."
        NSAppTransportSecurity:
          # Allow plain-HTTP LAN servers during dev; the production host is HTTPS.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # Primary icon stays in the asset catalog (AppIcon). Declaring CFBundleIcons
        # manually suppresses Xcode's auto-injected CFBundleIconName, so set it
        # explicitly — without it App Store Connect can't pull the marketing icon.
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIcon-claude:
              CFBundleIconFiles: ["AppIcon-claude"]
              UIPrerenderedIcon: false
            AppIcon-openai:
              CFBundleIconFiles: ["AppIcon-openai"]
              UIPrerenderedIcon: false
            AppIcon-gemini:
              CFBundleIconFiles: ["AppIcon-gemini"]
              UIPrerenderedIcon: false
            AppIcon-openwebui:
              CFBundleIconFiles: ["AppIcon-openwebui"]
              UIPrerenderedIcon: false
            AppIcon-hermesteal:
              CFBundleIconFiles: ["AppIcon-hermesteal"]
              UIPrerenderedIcon: false
            AppIcon-hermesnoir:
              CFBundleIconFiles: ["AppIcon-hermesnoir"]
              UIPrerenderedIcon: false
            AppIcon-odysseus:
              CFBundleIconFiles: ["AppIcon-odysseus"]
              UIPrerenderedIcon: false
