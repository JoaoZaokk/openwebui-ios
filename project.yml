name: OpenWebUI
options:
  bundleIdPrefix: com.example
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # The reusable core — local Swift package (app #2 will depend on it too).
  OpenWebUIKit:
    path: OpenWebUIKit
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  SwiftWhisper:
    url: https://github.com/exPHAT/SwiftWhisper
    branch: master
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.12.4"

settings:
  base:
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"   # set by setup.sh (env var) — your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OpenWebUI:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Info-macOS.plist"
          - "Resources/OpenWebUI-macOS.entitlements"
    dependencies:
      - package: OpenWebUIKit
      - package: MarkdownUI
      - package: SwiftWhisper
      - package: ZIPFoundation
      - package: FluidAudio
    settings:
      base:
        # Dev/simulator id. The App Store listing is `com.zao.openwebui` — pass
        # PRODUCT_BUNDLE_IDENTIFIER=com.zao.openwebui on the archive command, or
        # the export fails with "No profiles for 'com.example.openwebui'".
        PRODUCT_BUNDLE_IDENTIFIER: com.example.openwebui
        PRODUCT_NAME: OpenWebUI
        # 1.3 (7) went live on the App Store 2026-07 — that train is closed.
        # 1.4 (9) was staged on ASC but never submitted; superseded by 1.5.
        # 1.5 (11) was likewise staged and never submitted; superseded by 1.6,
        # which carries issue #12's fixes (voice language, server tools,
        # model nicknames) plus user-supplied Whisper models.
        # 1.6 (13) is live on the App Store since 2026-08-11.
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: OpenWebUI
        # Base language; the app ships en/ja/hi/bn .lproj and auto-detects the
        # device language (LanguageManager), with an in-app override in Settings.
        CFBundleDevelopmentRegion: pt-BR
        # Drive the version from the build settings (xcodegen otherwise hardcodes
        # CFBundleVersion=1, which overrode CURRENT_PROJECT_VERSION → "1.0 (1)").
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Orientations must live in the Info.plist itself — the INFOPLIST_KEY_*
        # build settings are ignored when a custom Info.plist is used, which made
        # the upload fail (90474). iPad needs all four for multitasking.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        ITSAppUsesNonExemptEncryption: false
        # Google **iOS** OAuth clients, for the system sign-in sheet
        # (ASWebAuthenticationSession), which reuses Safari's session so the user
        # picks an account instead of typing their email again.
        #
        # Keyed by bundle id because the app ships under two: the dev build and
        # the App Store build are different applications to Google, and an iOS
        # client is bound to exactly one bundle id. Picking at runtime keeps one
        # build setting from having to change between them.
        #
        # Not secrets — an iOS client has none, and Google binds each to its
        # bundle id, so neither is usable by anything but this app. A fork with
        # its own bundle id has to register its own.
        #
        # A **web** client cannot stand in here: Google refuses a custom scheme
        # for one, and its token endpoint requires a secret, which must never
        # ship inside an app.
        OWGoogleOAuthClientIDs:
          com.zao.openwebui: "1013326705202-7u9lh6i0tcv6t29vg2bqdhrtrh082ihu.apps.googleusercontent.com"
          com.example.openwebui: "1013326705202-lq54hfeo3pl30b6dnqoca4d2dha0hcsd.apps.googleusercontent.com"
        # Google redirects to the reversed client id, so the app has to own both
        # schemes. The one that does not match this build simply never fires.
        CFBundleURLTypes:
          - CFBundleURLName: "com.googleusercontent.apps.1013326705202-7u9lh6i0tcv6t29vg2bqdhrtrh082ihu"
            CFBundleURLSchemes: ["com.googleusercontent.apps.1013326705202-7u9lh6i0tcv6t29vg2bqdhrtrh082ihu"]
          - CFBundleURLName: "com.googleusercontent.apps.1013326705202-lq54hfeo3pl30b6dnqoca4d2dha0hcsd"
            CFBundleURLSchemes: ["com.googleusercontent.apps.1013326705202-lq54hfeo3pl30b6dnqoca4d2dha0hcsd"]
        NSLocalNetworkUsageDescription: "O app precisa acessar o servidor Open WebUI na sua rede local."
        NSMicrophoneUsageDescription: "Para ditar mensagens por voz."
        NSSpeechRecognitionUsageDescription: "Para transcrever sua voz em texto no dispositivo."
        NSPhotoLibraryUsageDescription: "Para anexar imagens às conversas."
        NSCameraUsageDescription: "Para capturar e anexar fotos às conversas."
        NSPhotoLibraryAddUsageDescription: "Para salvar imagens das conversas na sua galeria."
        NSAppTransportSecurity:
          # LAN-scoped only: plain HTTP allowed to local/private hosts; public hosts
          # use HTTPS (enforced app-side by OWConfig.normalize). No arbitrary loads.
          NSAllowsLocalNetworking: true
        # Primary icon stays in the asset catalog (AppIcon). Declaring CFBundleIcons
        # manually suppresses Xcode's auto-injected CFBundleIconName, so set it
        # explicitly — without it App Store Connect can't pull the marketing icon.
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIcon-claude:
              CFBundleIconFiles: ["AppIcon-claude"]
              UIPrerenderedIcon: false
            AppIcon-openai:
              CFBundleIconFiles: ["AppIcon-openai"]
              UIPrerenderedIcon: false
            AppIcon-gemini:
              CFBundleIconFiles: ["AppIcon-gemini"]
              UIPrerenderedIcon: false
            AppIcon-openwebui:
              CFBundleIconFiles: ["AppIcon-openwebui"]
              UIPrerenderedIcon: false
            AppIcon-hermesteal:
              CFBundleIconFiles: ["AppIcon-hermesteal"]
              UIPrerenderedIcon: false
            AppIcon-hermesnoir:
              CFBundleIconFiles: ["AppIcon-hermesnoir"]
              UIPrerenderedIcon: false
            AppIcon-odysseus:
              CFBundleIconFiles: ["AppIcon-odysseus"]
              UIPrerenderedIcon: false

  # Native macOS app — same SwiftUI source as iOS, with platform shims in
  # App/Config/PlatformCompat.swift. Apple Silicon Macs, macOS 14+.
  OpenWebUI-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
          - "Resources/OpenWebUI-macOS.entitlements"
    dependencies:
      - package: OpenWebUIKit
      - package: MarkdownUI
      - package: SwiftWhisper
      - package: ZIPFoundation
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.openwebui
        PRODUCT_NAME: OpenWebUI
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Resources/OpenWebUI-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: App/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: OpenWebUI
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 JoaoZaokk — PolyForm Noncommercial License 1.0.0"
        NSMicrophoneUsageDescription: "Para ditar mensagens por voz."
        NSSpeechRecognitionUsageDescription: "Para transcrever sua voz em texto no dispositivo."
        NSLocalNetworkUsageDescription: "O app precisa acessar o servidor Open WebUI na sua rede local."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
